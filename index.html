<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hüseyin Bahçe | Ürün Kataloğu</title>
  <meta name="description" content="Hüseyin Bahçe Ürün Kataloğu - fotoğraf odaklı, Google Sheets üzerinden canlı güncellenir." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- App Bar (mobile-stacked) -->
  <header class="appbar appbar-stacked">

    <!-- Row 1: Brand -->
    <div class="appbar-row appbar-row--brand">
      <div class="brand brand-fancy">
        <div class="brand-badge" aria-hidden="true">
          <span class="badge-inner">HB</span>
        </div>

        <div class="brand-text">
          <div class="brand-name">
            Hüseyin <span class="brand-surname">Bahçe</span>
          </div>
          <div class="brand-sub">Ürün Kataloğu</div>
        </div>
      </div>
    </div>

    <!-- Row 2: Controls -->
    <div class="appbar-row appbar-row--controls">

      <!-- Search -->
      <div class="search search-wide">
        <span class="search-ico">⌕</span>
        <input id="search" type="search" placeholder="Ürün veya kategori ara..." />
      </div>

      <!-- Phone -->
      <a class="phone-chip" href="tel:+905394927471" title="Telefonla ara">
        <span class="phone-ico">📞</span>
        <span class="phone-text">+90 539 492 74 71</span>
      </a>

      <!-- WhatsApp (header contact) -->
      <a class="wa-chip"
         href="#"
         data-role="header-whatsapp"
         title="WhatsApp ile yaz">
        <img
          class="wa-icon-img"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/1022px-WhatsApp.svg.png"
          alt="WhatsApp">
        <span class="wa-text">WhatsApp</span>
      </a>

    </div>
  </header>

  <!-- Status -->
  <div id="status" class="status hidden" role="status" aria-live="polite"></div>

  <main class="container">

    <!-- CATEGORIES -->
    <section id="categoryView">
      <div class="section-head">
        <h2>Kategoriler</h2>
        <div class="hint">Fotoğraf odaklı katalog</div>
      </div>

      <div id="categories" class="cat-grid"></div>

      <div id="catEmpty" class="empty hidden">
        Kategori bulunamadı. Google Sheets verinizi kontrol edin.
      </div>
    </section>

    <!-- PRODUCTS -->
    <section id="productView" class="hidden">
      <div class="product-bar">
        <button id="back" class="back-btn" aria-label="Kategorilere dön">←</button>
        <div class="product-titles">
          <h2 id="viewTitle">Ürünler</h2>
          <div id="viewSubtitle" class="sub"></div>
        </div>
      </div>

      <div id="products" class="prod-grid"></div>

      <div id="prodEmpty" class="empty hidden">
        Bu görünüm için ürün bulunamadı.
      </div>
    </section>

  </main>

  <!-- Floating Cart Bar -->
  <div id="cartBar" class="cart-bar hidden">
    <button id="cartBarButton" class="cart-bar-button" type="button">
      <span class="cart-bar-icon">🧺</span>
      <span class="cart-bar-label">Sepet</span>
      <span id="cartCount" class="cart-badge">0</span>
    </button>
  </div>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="cart-drawer hidden" aria-hidden="true">
    <div id="cartDrawerBackdrop" class="cart-drawer-backdrop"></div>
    <div class="cart-drawer-panel" role="dialog" aria-modal="true">
      <header class="cart-drawer-header">
        <span class="cart-drawer-title">Sepetiniz</span>
        <button id="cartClose" class="cart-close-btn" type="button" aria-label="Sepeti kapat">✕</button>
      </header>

      <div id="cartItems" class="cart-items"></div>
      <div id="cartEmptyMsg" class="cart-empty-msg">Sepetiniz boş.</div>

      <div class="cart-drawer-footer">
        <div class="cart-total-row">
          <span class="cart-total-label">Tahmini toplam:</span>
          <span id="cartTotal" class="cart-total-value">-</span>
        </div>

        <label class="cart-note-label">
          Notunuz (isteğe bağlı)
          <textarea id="cartNote" rows="2" placeholder="Teslimat adresi, saat tercihi, ekstra notlar..."></textarea>
        </label>

        <button id="cartSend" class="cart-send-btn" type="button">
          WhatsApp ile Gönder
        </button>

        <button id="cartClear" class="cart-clear-btn" type="button">
          Sepeti Temizle
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>Hüseyin Bahçe</span>
    <span class="dot">•</span>
    <a class="footer-phone" href="tel:+905394927471">+90 539 492 74 71</a>
    <span class="dot">•</span>
    <a class="footer-wa"
       href="#"
       data-role="footer-whatsapp">
      WhatsApp
    </a>
  </footer>

  <!-- Lightbox / Fullscreen viewer -->
  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <div class="lightbox-backdrop" data-lb-close></div>

    <div class="lightbox-panel" role="dialog" aria-modal="true">
      <button class="lb-close" type="button" aria-label="Kapat" data-lb-close>✕</button>

      <button class="lb-nav lb-prev" type="button" aria-label="Önceki">‹</button>
      <button class="lb-nav lb-next" type="button" aria-label="Sonraki">›</button>

      <div class="lb-media">
        <img id="lbImg" alt="" />
      </div>

      <div class="lb-caption">
        <div id="lbTitle" class="lb-title"></div>
        <div id="lbSub" class="lb-sub"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
